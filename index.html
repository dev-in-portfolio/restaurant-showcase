<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polished Showcase | Restaurant Website Showroom</title>
  <meta name="description" content="Presentation-ready showcase of approved 6-page restaurant website rebuilds and branding concepts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
</head>
<body>
  <main class="portal-container">
    <header class="portal-header">
      <span class="portal-eyebrow">Production Showroom</span>
      <h1 class="portal-title">Polished Restaurant Showcase</h1>
      <p class="portal-subtitle">Presentation-ready restaurant website demonstrations featuring verified 6-page branding concepts, responsive design, and interactive experience modules.</p>
      <div class="portal-stats" id="portal-stats" aria-live="polite">Loading showroom index…</div>
      <div class="portal-archive-link" style="margin-top: 1rem; display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap;">
        <a href="archive/index.html" class="archive-link" style="color: var(--text-muted); font-size: 0.9rem; text-decoration: underline; transition: color 0.2s;">🏛️ View Retired Demonstrations →</a>
        <a href="archive/hold/index.html" class="archive-link" style="color: var(--text-muted); font-size: 0.9rem; text-decoration: underline; transition: color 0.2s;">⏳ View Hold Demonstrations →</a>
      </div>
      <nav class="alpha-nav" id="alpha-nav" aria-label="Filter restaurants alphabetically"></nav>
    </header>

    <section class="restaurant-grid" id="restaurant-grid" aria-label="Restaurant Showroom Grid"></section>
  </main>

  <script>
    (() => {
      'use strict';

      const grid = document.getElementById('restaurant-grid');
      const alphaNav = document.getElementById('alpha-nav');
      const stats = document.getElementById('portal-stats');

      const sortName = (name = '') => name
        .replace(/^(the|a|an)\s+/i, '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');

      const getBaseDir = () => {
        let path = window.location.pathname;
        if (/\.[a-zA-Z0-9]+$/.test(path)) {
          return path.substring(0, path.lastIndexOf('/') + 1);
        }
        if (!path.endsWith('/')) {
          return path + '/';
        }
        return path;
      };

      function render(items) {
        const sorted = [...items].sort((a, b) => sortName(a.name).localeCompare(sortName(b.name), undefined, { sensitivity: 'base' }));
        const letterFor = item => (sortName(item.name).charAt(0).toUpperCase() || '#');
        const letters = [...new Set(sorted.map(letterFor))];

        alphaNav.innerHTML = letters.map(letter => `<a href="#letter-${letter}">${letter}</a>`).join('');

        const baseDir = getBaseDir();
        let lastLetter = '';

        grid.innerHTML = sorted.map(item => {
          const letter = letterFor(item);
          const heading = letter !== lastLetter ? `<h2 class="letter-heading" id="letter-${letter}">${letter}</h2>` : '';
          lastLetter = letter;

          const relPath = item.href || `restaurants/${item.slug || ''}/index.html`;
          let targetUrl = '';
          if (relPath.startsWith('http://') || relPath.startsWith('https://') || relPath.startsWith('/')) {
            targetUrl = relPath;
          } else {
            targetUrl = baseDir + relPath;
          }

          const badge = 'PREMIUM SHOWCASE';
          const label = 'View Presentation Build';

          return `${heading}
            <article class="portal-card" data-href="${targetUrl}">
              <div class="card-image-wrapper">
                <span class="card-rating-badge">${badge}</span>
                <div class="card-img-placeholder" style="background:${item.gradient || 'linear-gradient(135deg,#172033,#334155)'}">
                  ${item.emoji || '🍽️'}
                </div>
              </div>
              <div class="card-content">
                <span class="card-cuisine">${item.cuisine || 'Restaurant Rebuild'}</span>
                <h2 class="card-title">${item.name}</h2>
                <p class="card-description">${item.description || 'Presentation-ready 6-page website rebuild.'}</p>
                <div class="card-footer">
                  <span class="card-price">Area: <span>${item.area || 'Charlotte, NC'}</span></span>
                  <a href="${targetUrl}" class="visit-btn">${label} →</a>
                </div>
              </div>
            </article>`;
        }).join('');

        stats.textContent = `${sorted.length} presentation-ready restaurant builds in showroom`;
      }

      grid.addEventListener('click', (e) => {
        const card = e.target.closest('.portal-card[data-href]');
        if (!card) return;
        const href = card.getAttribute('data-href');
        if (!href) return;
        if (e.target.closest('a')) return;
        window.location.href = href;
      });

      async function init() {
        try {
          const res = await fetch(`data/restaurants.json?v=${Date.now()}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            render(data);
            return;
          }
        } catch (err) {
          console.warn('Could not load data/restaurants.json:', err.message);
        }
        stats.textContent = 'No showroom data loaded. Please run promotion script.';
      }

      init();
    })();
  </script>
</body>
</html>
